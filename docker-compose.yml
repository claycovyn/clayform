services:
  clayform:
    build: .
    ports:
      - "3000:3000"
    environment:
      CLAYFORM_SECRET: ${CLAYFORM_SECRET:?Set CLAYFORM_SECRET (openssl rand -hex 32)}
      CLAYFORM_SIGNUPS: ${CLAYFORM_SIGNUPS:-open}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - clayform-data:/data
    restart: unless-stopped
volumes:
  clayform-data:
