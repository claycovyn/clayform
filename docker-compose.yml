services:
  clayform:
    build: .
    ports:
      - "3000:3000"
    environment:
      CLAYFORM_PASSWORD: ${CLAYFORM_PASSWORD:?Set CLAYFORM_PASSWORD}
      CLAYFORM_SECRET: ${CLAYFORM_SECRET:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - clayform-data:/data
    restart: unless-stopped
volumes:
  clayform-data:
